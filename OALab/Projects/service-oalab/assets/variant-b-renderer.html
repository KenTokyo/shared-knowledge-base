<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OALab Service — Luminous Atelier Render Source</title>
  <style>
    :root {
      --canvas:#f3f0e9;--surface:#fffefb;--soft:#ece7de;--line:#d7d0c5;
      --ink:#17191c;--muted:#6c726f;--blue:#345bff;--violet:#735cff;
      --jade:#0c9a70;--coral:#db6255;--amber:#b97812;
      --shadow:0 14px 35px rgba(62,52,39,.055);--r:13px
    }
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--canvas);color:var(--ink)}
    button,input{font:inherit}.app{width:1536px;height:1024px;display:grid;grid-template-columns:260px 1fr;background:var(--canvas)}
    .rail{border-right:1px solid var(--line);padding:28px 18px 24px;display:flex;flex-direction:column;background:#f6f3ed}
    .brand{height:64px;display:flex;align-items:flex-start;gap:13px;padding:6px 12px;font-size:20px;font-weight:720;letter-spacing:-.02em}
    .mark{width:31px;height:31px;position:relative;color:var(--blue)}.mark:before,.mark:after{content:"";position:absolute;background:currentColor}
    .mark:before{width:4px;height:22px;left:13px;top:3px;transform:rotate(-35deg);border-radius:3px;box-shadow:12px 8px 0 -1px currentColor}
    .mark:after{width:9px;height:9px;left:1px;top:18px;border:3px solid currentColor;background:var(--canvas);border-radius:50%;box-shadow:13px -18px 0 -3px var(--canvas),13px -18px 0 0 currentColor,26px 0 0 -3px var(--canvas),26px 0 0 0 currentColor}
    .nav{margin-top:20px;display:grid;gap:7px}.nav-item{height:48px;display:flex;align-items:center;gap:13px;padding:0 14px;border-radius:10px;color:#4d514f;position:relative}
    .nav-item.active{background:var(--surface);color:var(--blue);box-shadow:0 2px 14px rgba(62,52,39,.04)}.nav-item.active:before{content:"";position:absolute;left:-18px;width:3px;height:31px;background:var(--blue);border-radius:0 4px 4px 0}
    .ico{width:24px;height:24px;border:1.5px solid currentColor;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800}.count{margin-left:auto;background:var(--blue);color:white;border-radius:20px;padding:1px 7px;font-size:11px}
    .rail-foot{margin-top:auto;border-top:1px solid var(--line);padding:20px 10px 0;display:grid;gap:16px}.identity{display:flex;align-items:center;gap:11px}.avatar{width:40px;height:40px;border-radius:50%;background:#e5defd;display:grid;place-items:center;font-weight:700;color:#5040a2}.tiny{font-size:12px;color:var(--muted)}
    .main{min-width:0;display:flex;flex-direction:column}.topbar{height:88px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 34px;gap:17px;background:rgba(255,254,251,.45)}
    h1{margin:0;font-size:29px;letter-spacing:-.035em}h2{margin:0;font-size:22px;letter-spacing:-.025em}h3{margin:0;font-size:15px}.spacer{flex:1}
    .btn{height:40px;border-radius:9px;border:1px solid var(--line);padding:0 16px;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--coral);border-color:#e8b8b1}.btn[disabled]{background:#d9d7d2;border-color:#d9d7d2;color:#969995}.square{width:40px;padding:0;font-size:18px}.content{height:936px;padding:26px 32px 30px;min-width:0}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:760}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:650}.pill.blue{color:var(--blue);background:#f1f3ff}.pill.jade{color:var(--jade);background:#edf9f5}.pill.amber{color:var(--amber);background:#fff8e8}.pill.coral{color:var(--coral);background:#fff2f0}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}.search{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 14px;color:var(--muted)}
    .divider{height:1px;background:var(--line)}.row{display:flex;align-items:center}.status-ok{color:var(--jade)}.status-bad{color:var(--coral)}.metric{font-size:22px;font-weight:720;letter-spacing:-.02em}.progress{height:5px;border-radius:5px;background:#e5e0d8;overflow:hidden}.progress>i{display:block;height:100%;background:var(--blue);border-radius:5px}.muted{color:var(--muted)}
    /* History */
    .history{height:100%;display:grid;grid-template-columns:440px 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
    .history-list{border-right:1px solid var(--line);background:#faf8f3}.history-tools{height:79px;padding:18px;display:grid;grid-template-columns:1fr 82px;gap:10px;border-bottom:1px solid var(--line)}
    .history-item{height:118px;padding:18px;display:grid;grid-template-columns:47px 1fr auto;gap:14px;border-bottom:1px solid #e8e3da;position:relative}.history-item.active{background:var(--surface)}.history-item.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
    .history-icon{width:45px;height:45px;border-radius:10px;background:#efebe4;display:grid;place-items:center;color:var(--blue);font-weight:800}.history-title{font-weight:700;font-size:15px;margin-bottom:5px}.history-detail{padding:34px;display:flex;flex-direction:column}.thread{margin-top:28px;border-top:1px solid var(--line)}.message{padding:26px 0;display:grid;grid-template-columns:42px 1fr;gap:15px;border-bottom:1px solid #e8e3da}.bubble-avatar{width:38px;height:38px;border-radius:50%;background:#e6ebff;color:var(--blue);display:grid;place-items:center;font-weight:700}.composer{margin-top:auto;height:78px;border:1px solid var(--line);border-radius:11px;display:flex;align-items:center;padding:0 16px;color:var(--muted);background:#fff}
    /* Notification */
    .prefs{max-width:1110px;margin:10px auto;padding:30px}.pref-head{display:grid;grid-template-columns:1fr 150px 150px 150px;padding:0 18px 14px;color:var(--muted)}.pref-row{height:98px;border-top:1px solid #e5e0d8;display:grid;grid-template-columns:1fr 150px 150px 150px;align-items:center;padding:0 18px}.channel{display:flex;align-items:center;gap:15px;font-size:17px;font-weight:680}.channel-icon{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--blue)}.radio{width:19px;height:19px;border:1.5px solid #9d9b96;border-radius:50%}.radio.on{border:6px solid var(--blue)}.quiet{height:92px;border-top:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 18px}.time{border:1px solid var(--line);border-radius:8px;padding:10px 18px;background:#faf8f3}.switch{width:52px;height:28px;border-radius:30px;background:var(--blue);padding:4px}.switch:after{content:"";display:block;margin-left:auto;width:20px;height:20px;background:white;border-radius:50%}.save{width:460px;margin:25px auto 4px;display:flex}
    /* Board */
    .health{height:72px;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}.health>div{background:var(--surface);padding:13px 18px}.health .metric{font-size:18px}.board{height:calc(100% - 90px);margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.column{background:#ede8df;border:1px solid var(--line);border-radius:12px;padding:13px;overflow:hidden}.column-head{display:flex;align-items:center;padding:3px 3px 13px;font-weight:750;font-size:16px}.badge{margin-left:auto;background:#ddd6ca;border-radius:16px;padding:2px 8px;font-size:11px}.ticket{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:11px;box-shadow:0 4px 13px rgba(57,48,37,.035)}.ticket.bad{border-left:3px solid var(--coral)}.ticket.wait{border-left:3px solid var(--blue)}.ticket h3{margin:8px 0 5px}.ticket-meta{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid #ebe6de;font-size:11px;color:var(--muted)}
    /* Job */
    .job{height:100%;display:grid;grid-template-columns:330px 1fr 315px;gap:14px}.job-col{display:flex;flex-direction:column;gap:14px;min-width:0}.panel{padding:20px}.conversation{height:356px}.note{height:245px}.attachment{height:230px}.timeline{height:100%;padding:22px}.timeline-head{display:flex;align-items:center;margin-bottom:18px}.step{min-height:95px;padding:14px 12px 14px 58px;border-top:1px solid #e7e2d9;position:relative}.step:before{content:"✓";position:absolute;left:12px;top:14px;width:27px;height:27px;border-radius:50%;background:#e8f8f2;color:var(--jade);display:grid;place-items:center;font-weight:800}.step:after{content:"";position:absolute;width:1px;background:#b8dfd1;left:25px;top:42px;bottom:-14px}.step:last-of-type:after{display:none}.attempt{margin-top:16px;padding:15px;border:1px solid #efc3bc;border-radius:9px;color:var(--coral)}.context{height:100%;padding:22px}.kv{display:grid;grid-template-columns:1fr 1.25fr;gap:13px;padding:17px 0;border-bottom:1px solid #e7e2d9}.actions{margin-top:24px;display:grid;gap:10px}.actions .btn{width:100%}
    /* Release */
    .release{height:100%;display:grid;grid-template-columns:1.05fr 1.15fr 350px;gap:15px}.release-col{display:flex;flex-direction:column;gap:15px}.release .panel{padding:21px}.release .evidence{height:382px}.e-line{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:15px 0;border-bottom:1px solid #e7e2d9}.check-list{padding:0 18px}.check-row{height:58px;border-bottom:1px solid #e7e2d9;display:flex;align-items:center;gap:11px}.check{width:21px;height:21px;border-radius:50%;background:#e4f7f0;color:var(--jade);display:grid;place-items:center;font-size:12px;font-weight:900}.confirm{border:1px solid #a6b5ff;background:#fbfbff}.confirm-hero{padding:25px;border-bottom:1px solid #d8defb}.lock{width:51px;height:51px;border-radius:15px;background:#e9edff;color:var(--blue);display:grid;place-items:center;font-size:22px;margin-bottom:13px}.confirm-body{padding:25px}.confirm-input{height:47px;border:1px solid var(--line);border-radius:8px;padding:0 13px;margin:12px 0;background:white;color:#a0a29e;width:100%}.gate-list{margin-top:22px;border-top:1px solid #e2e4ef}.gate{height:54px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #e2e4ef;font-size:12px}.usage{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.usage>div{padding:13px;background:#f7f4ee;border-radius:8px}.usage strong{display:block;font-size:17px;margin:4px 0}
  </style>
</head>
<body><div id="root"></div>
<script>
const navClient=[['+','Neue Anfrage'],['A','Anfragen'],['M','Mitteilungen'],['D','Dateien'],['P','Profil'],['E','Einstellungen']];
const navInternal=[['O','Operations'],['A','Anfragen'],['K','Kunden'],['N','Analytics'],['R','Releases'],['U','Nutzung']];
function shell(active,internal,body,title,actions=''){
 const items=(internal?navInternal:navClient).map(([i,n])=>`<div class="nav-item ${n===active?'active':''}"><span class="ico">${i}</span>${n}${n==='Anfragen'&&!internal?'<span class="count">2</span>':''}</div>`).join('');
 return `<div class="app"><aside class="rail"><div class="brand"><span class="mark"></span>OALab Service</div><nav class="nav">${items}</nav><div class="rail-foot"><div class="tiny">${internal?'INTERNER BEREICH':'PRIVATER MANDANT'}</div><div class="identity"><div class="avatar">${internal?'OA':'CD'}</div><div><b>${internal?'OALab Team':'Clara Demir'}</b><div class="tiny">${internal?'Operator':'Kundin'}</div></div></div></div></aside><main class="main"><header class="topbar"><h1>${title}</h1><span class="spacer"></span>${actions}</header><section class="content">${body}</section></main></div>`}
function history(){
 const rows=[['K','Kontaktformular mobil','In Bearbeitung','Heute, 09:42'],['S','Startseite aktualisieren','Deine Freigabe','Gestern, 16:18'],['L','Logo austauschen','Live','Gestern, 11:07'],['P','Preise anpassen','In Bearbeitung','07.05.2025'],['I','Impressum ergänzen','Live','06.05.2025'],['D','Danke-Seite optimieren','In Bearbeitung','05.05.2025']];
 const list=rows.map((r,i)=>`<div class="history-item ${i===0?'active':''}"><div class="history-icon">${r[0]}</div><div><div class="history-title">${r[1]}</div><div class="tiny">Zuletzt aktualisiert<br>${r[3]}</div></div><div><span class="pill ${r[2]==='Live'?'jade':r[2]==='Deine Freigabe'?'amber':'blue'}">${r[2]}</span>${i===0?'<div style="text-align:right;margin-top:16px;color:var(--blue)">●</div>':''}</div></div>`).join('');
 const body=`<div class="history"><div class="history-list"><div class="history-tools"><div class="search">⌕ &nbsp; Anfragen durchsuchen</div><button class="btn">Alle⌄</button></div>${list}</div><div class="history-detail"><div class="row"><div><h2>Kontaktformular mobil</h2><div class="muted" style="margin-top:6px">Zuletzt aktualisiert: Heute, 09:42</div></div><span class="spacer"></span><span class="pill blue">In Bearbeitung</span></div><div class="thread"><div class="message"><div class="bubble-avatar">Du</div><div><b>Heute, 09:12</b><p>Bitte das Kontaktformular für mobile Geräte optimieren.</p><div class="card" style="padding:14px">▧ &nbsp; Screenshot.png &nbsp; <span class="muted">412 KB</span></div></div></div><div class="message"><div class="bubble-avatar">OA</div><div><b>OALab Service · Heute, 09:38</b><p>Danke für die klare Rückmeldung. Wir passen Layout und Bedienbarkeit auf mobilen Geräten an.</p></div></div></div><div class="composer">＋ &nbsp; Weitere Nachricht schreiben …<span class="spacer"></span><button class="btn primary square">→</button></div></div></div>`;
 return shell('Anfragen',false,body,'Verlauf','<button class="btn primary">＋ Neue Anfrage</button>')}
function prefs(){
 const row=(icon,name,state,primary,fallback,disabled='')=>`<div class="pref-row"><div class="channel"><div class="channel-icon">${icon}</div><div>${name}<div class="tiny ${disabled?'status-bad':'status-ok'}" style="margin-top:5px">${disabled?'⊗ Noch nicht verfügbar':state}</div></div></div><div class="radio ${primary?'on':''}"></div><div class="radio ${fallback?'on':''}"></div><button class="btn" ${disabled?'disabled':''}>Test senden</button></div>`;
 const body=`<div class="prefs card"><div class="pref-head"><span></span><span>Primärer Kanal</span><span>Fallback</span><span></span></div>${row('✉','E-Mail','✓ Verifiziert',1,0)}${row('W','WhatsApp','✓ Verifiziert',0,1)}${row('S','SMS','Inaktiv',0,0)}${row('◎','Signal','',0,0,1)}<div class="quiet"><b>☾ &nbsp; Ruhezeiten</b><span class="time">22:00⌄</span><span>–</span><span class="time">07:00⌄</span><span class="spacer"></span><div class="switch"></div></div><div class="save"><button class="btn primary" style="width:100%">Einstellungen speichern</button></div></div>`;
 return shell('Einstellungen',false,body,'Benachrichtigungen','<button class="btn">← Zurück</button>')}
const tickets={
 'Eingang':[['Alpha GmbH','Markenrelaunch','Logo-Varianten im Dunkelmodus','OA-1081','8 Min.'],['Beta AG','Produktkampagne','Hero-Bild für Landingpage','OA-1080','12 Min.'],['Gamma KG','Messe 2025','Messestand visualisieren','OA-1079','27 Min.']],
 'Geplant':[['Delta GmbH','Produktlaunch','Produktfotos Set','OA-1078','51 Min.'],['Epsilon AG','Social Media','Carousel Banner Serie','OA-1077','1 Std.'],['Zeta GmbH','Imagefilm','Storyboard Sequenz 01','OA-1076','2 Std.']],
 'In Arbeit':[['Eta AG','Erklärfilm','Animationsszene 02','OA-1075','2 Std.'],['Theta GmbH','Produktvisualisierung','3D-Render Variante B','OA-1074','Fehlgeschlagen'],['Iota AG','Website Relaunch','Header Visual Design','OA-1073','4 Std.']],
 'Freigabe':[['Kappa GmbH','Kampagne Q2','Key Visual Final','OA-1072','Freigabe bereit'],['Lambda AG','Produktkatalog','Katalog Layout v3','OA-1071','Warten auf Kunde'],['Mu GmbH','Eventausstattung','Rollup Design','OA-1070','Freigabe bereit']]};
function board(){
 const cols=Object.entries(tickets).map(([name,rs])=>`<div class="column"><div class="column-head">${name}<span class="badge">${rs.length}</span></div>${rs.map(r=>`<div class="ticket ${r[4]==='Fehlgeschlagen'?'bad':r[4]==='Warten auf Kunde'?'wait':''}"><div class="tiny">${r[0]} · ${r[1]}</div><h3>${r[2]}</h3><div class="mono tiny">${r[3]}</div><div class="ticket-meta"><span>▧ ${name==='In Arbeit'?'2 Medien':'3 Dateien'}</span><span>${r[4]}</span></div></div>`).join('')}</div>`).join('');
 const body=`<div class="health"><div><span class="label">Queue</span><div class="metric">4 Min.</div></div><div><span class="label">Worker</span><div class="metric status-ok">3 / 4</div></div><div><span class="label">Fehler</span><div class="metric status-bad">2</div></div><div><span class="label">Speichertrend</span><div class="metric">72 % ↗</div></div></div><div class="board">${cols}</div>`;
 return shell('Operations',true,body,'Operations','<button class="btn">⌕ Filter</button>')}
function job(){
 const steps=['Triage','Medienanalyse bereit','Job-Lease','Checks 8/8','Beta erstellen'];
 const body=`<div class="job"><div class="job-col"><div class="card panel conversation"><h3>Kundensicht</h3><p class="tiny">Heute, 09:12</p><p>Bitte erstellt eine interne Beta des Onboarding-Videos mit dem neuen Logo.</p><div class="card" style="padding:12px;margin-top:18px">▧ Onboarding_Storyboard.pdf</div><div class="card" style="padding:12px;margin-top:8px">▧ Logo_neu.svg</div><div class="search" style="margin-top:18px">Nachricht an Kunde …</div></div><div class="card panel note"><h3>Interne Notiz</h3><p>Logo-Datei geprüft. Storyboard vollständig. Drei neue Ansichten vorbereiten.</p><div class="tiny">🔒 Nur intern sichtbar</div></div><div class="card panel attachment"><h3>Anhänge (intern)</h3><p class="tiny">Briefing_2025-05-16.pdf · 512 KB</p><p class="tiny">Screens_aktuell.zip · 18.7 MB</p><p class="tiny">Musik_Option_A.mp3 · 4.1 MB</p></div></div><div class="card timeline"><div class="timeline-head"><h2>Ausführung</h2><span class="spacer"></span><span class="pill jade">Versuch 2 von 4</span></div>${steps.map((s,i)=>`<div class="step"><b>${s}</b><div class="tiny">${i===1?'Medienanalyse bereit':i===3?'Qualitäts- und Sicherheitsprüfungen bestanden':i===4?'Vorschau kann erzeugt werden':'Heute, 09:'+(14+i*2)}</div></div>`).join('')}<div class="attempt">⊗ &nbsp; Versuch 1 fehlgeschlagen <span style="float:right">Heute, 08:47⌄</span></div></div><div class="card context"><h3>Kontext</h3>${[['Kunde','Alpha Solutions GmbH'],['Projekt','Onboarding-Video DE'],['Kontingent','64 / 200 Min.'],['Aktueller Versuch','2 von 4'],['Worker','Worker verbunden'],['Status','Checks 8/8']].map(x=>`<div class="kv"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div class="actions"><button class="btn primary">Beta erstellen</button><button class="btn">Neu versuchen</button><button class="btn danger">Abbrechen</button></div></div></div>`;
 return shell('Anfragen',true,body,'Anfrage #OA-1042','<span class="pill jade">Worker verbunden</span>')}
function release(){
 const evidence=['Beta geprüft','Kundenfreigabe erhalten','Checks 8/8','Rollback vorbereitet'];
 const checks=['Build & Artefakte','Automatisierte Tests','Sicherheitsscan','Qualitätsanalyse','Datenmigration','Kompatibilitätsprüfung','Performance Test','Smoke Test'];
 const body=`<div class="release"><div class="release-col"><div class="card panel evidence"><span class="label">Vorschau & aktueller Stand</span><div class="kv"><span>Projekt</span><b>ACME Plattform</b></div><div class="kv"><span>Commit</span><b class="mono">7f3a9c2b1d4e</b></div><div class="kv"><span>Umgebung</span><b class="status-ok">● Beta</b></div><div style="margin-top:20px">${evidence.map((e,i)=>`<div class="e-line"><span class="check">✓</span><span><b>${e}</b><div class="tiny">16.05.2025 · 10:${18+i*7}</div></span><button class="btn" style="height:30px">Details</button></div>`).join('')}</div></div><div class="card panel"><span class="label">Nutzung dieses Auftrags</span><div class="usage"><div>Seitenaufrufe<strong>124.538</strong><span class="tiny">7 Tage</span></div><div>Aktive Nutzer<strong>18.742</strong><span class="tiny">7 Tage</span></div><div>API-Aufrufe<strong>2,41 Mio.</strong><span class="tiny">7 Tage</span></div><div>Fehlerquote<strong>0,08 %</strong><span class="tiny">7 Tage</span></div></div></div></div><div class="release-col"><div class="card"><div class="panel row"><h3>Checks 8/8</h3><span class="spacer"></span><span class="pill jade">Risiko: Niedrig</span></div><div class="check-list">${checks.map(c=>`<div class="check-row"><span class="check">✓</span><b>${c}</b><span class="spacer"></span><span class="tiny">Bestanden</span></div>`).join('')}</div></div><div class="card panel"><span class="label">Produktion</span><div class="kv"><span>Ziel</span><b>Prod-01 · EU-West</b></div><div class="kv"><span>Rollback</span><b class="status-ok">Rollback vorbereitet</b></div></div></div><div class="card confirm"><div class="confirm-hero"><div class="lock">♙</div><h2>Produktion</h2><div class="status-ok"><b>Nur durch OALab</b></div></div><div class="confirm-body"><span class="label">Projektname bestätigen</span><input class="confirm-input" placeholder="Projektname bestätigen"><button class="btn" disabled style="width:100%">Jetzt veröffentlichen</button><div class="tiny" style="margin-top:9px">Eingabe erforderlich, um fortzufahren</div><div class="gate-list">${['Beta geprüft','Kundenfreigabe erhalten','Checks 8/8','Risiko: Niedrig','Rollback vorbereitet'].map(g=>`<div class="gate"><span class="check">✓</span>${g}</div>`).join('')}</div></div></div></div>`;
